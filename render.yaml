# Blueprint Render : API (Docker) + site statique. Voir « Déploiement sur Render » dans README.md.
# Aucune valeur secrète ici : les variables « sync: false » sont saisies dans le tableau de bord Render.
# Ordre : déployer l'API d'abord (son adresse sert à VITE_API_URL), puis le site (son adresse sert à Cors__AllowedOrigins).
services:
  - type: web
    name: el-resto-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Chaîne Npgsql de la base Neon (Host=...;Database=...;Username=...;Password=...;SSL Mode=Require).
      - key: ConnectionStrings__Default
        sync: false
      # Clé de signature des jetons, 32 caractères minimum, aléatoire.
      - key: Jwt__SecretKey
        sync: false
      # Adresse(s) du site, séparées par des virgules, sans slash final (https://el-resto.onrender.com).
      - key: Cors__AllowedOrigins
        sync: false
      # Mot de passe du compte « admin », lu UNIQUEMENT par la commande --seed (lancée depuis le PC).
      # Peut rester vide sur Render si --seed est lancé depuis le PC.
      - key: Seed__AdminPassword
        sync: false

  - type: web
    name: el-resto
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Les routes de l'application (/menu, /admin...) renvoient index.html ; les fichiers existants sont servis tels quels.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Fichiers de Vite nommés par empreinte : cache long sans risque.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Adresse de l'API, sans slash final (https://el-resto-api.onrender.com). Lue au build : redéployer si elle change.
      - key: VITE_API_URL
        sync: false
      # Adresse publique du site, encodée dans les QR des tables (https://el-resto.onrender.com).
      - key: VITE_PUBLIC_URL
        sync: false
